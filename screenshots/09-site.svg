<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Browser — the site served over HTTPS">
  <rect width="1000" height="620" rx="10" fill="#0d1117"/>
  <path d="M0 10 A10 10 0 0 1 10 0 H990 A10 10 0 0 1 1000 10 V44 H0 Z" fill="#161b22"/>
  <circle cx="26" cy="22" r="7" fill="#ff5f56"/>
  <circle cx="50" cy="22" r="7" fill="#ffbd2e"/>
  <circle cx="74" cy="22" r="7" fill="#27c93f"/>
  <text x="500" y="27" text-anchor="middle" fill="#8b949e" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14">Browser — the site served over HTTPS</text>
  <rect x="0" y="44" width="1000" height="46" fill="#f6f8fa"/>
  <rect x="18" y="57" width="964" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="34" y="76" fill="#3fb950" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14">&#128274;</text>
  <text x="56" y="76" fill="#24292f" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14">https://hardened.example.com</text>
  <text x="978" y="76" text-anchor="end" fill="#57606a" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13">Secure</text>
  <rect x="0" y="90" width="1000" height="530" fill="#ffffff"/>
  <text x="60" y="175" fill="#24292f" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="36" font-weight="bold" xml:space="preserve">HARDENED LINUX WEB SERVER</text>
  <text x="60" y="208" fill="#57606a" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="16" xml:space="preserve">A bare Ubuntu/Debian VM turned into a safe-to-expose public web server.</text>
  <text x="60" y="246" fill="#57606a" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="16" xml:space="preserve">Served from nginx over TLS 1.3, with HSTS, CSP and an auto-renewing certificate.</text>
  <text x="60" y="296" fill="#1a7f37" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="16" font-weight="bold" xml:space="preserve">● HTTPS / TLS 1.3</text>
  <text x="60" y="326" fill="#1a7f37" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="16" font-weight="bold" xml:space="preserve">● HTTP → HTTPS 301</text>
  <text x="60" y="356" fill="#1a7f37" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="16" font-weight="bold" xml:space="preserve">● Security headers enabled</text>
  <text x="60" y="386" fill="#1a7f37" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="16" font-weight="bold" xml:space="preserve">● Static site, owner: webuser</text>
  <text x="60" y="448" fill="#0969da" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="16" xml:space="preserve">GET /healthz  →  200 ok</text>
  <text x="60" y="490" fill="#57606a" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve">Server: nginx   •   X-Content-Type-Options: nosniff   •   Strict-Transport-Security: max-age=31536000</text>
  <text x="60" y="570" fill="#8c959f" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14" xml:space="preserve">zero dependencies  •  reproducible with scripts/setup.sh  •  MIT licensed</text>
  </svg>
