  <text x="26" y="254" fill="#8b949e" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve">- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -</text>
  <text x="26" y="276" fill="#c9d1d9" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve">Processing /etc/letsencrypt/renewal/hardened.example.com.conf</text>
  <text x="26" y="298" fill="#c9d1d9" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve">Simulating renewal of an existing certificate for hardened.example.com</text>
