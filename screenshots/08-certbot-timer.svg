  <text x="41.626" y="78" fill="#e6edf3" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve">systemctl status certbot.timer --no-pager</text>
  <text x="26" y="100" fill="#3fb950" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve">● certbot.timer - Run certbot twice daily</text>
  <text x="26" y="122" fill="#c9d1d9" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve">     Loaded: loaded (/lib/systemd/system/certbot.timer; enabled; vendor preset: enabled)</text>
  <text x="26" y="144" fill="#c9d1d9" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve">     Active: active (waiting) since Wed 2026-11-18 06:00:01 UTC; 2 days ago</text>
  <text x="26" y="166" fill="#c9d1d9" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve">    Trigger: Fri 2026-11-21 03:37:12 UTC; 18h left</text>
  <text x="26" y="188" fill="#c9d1d9" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve"></text>
  <text x="26" y="210" fill="#3fb950" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve">$ </text>
  <text x="41.626" y="210" fill="#e6edf3" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13" xml:space="preserve">sudo certbot renew --dry-run</text>
