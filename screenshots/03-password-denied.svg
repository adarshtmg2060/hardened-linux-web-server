  <text x="26" y="78" fill="#3fb950" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve">$ </text>
  <text x="43.429" y="78" fill="#e6edf3" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve">ssh -o PreferredAuthentications=password \</text>
  <text x="26" y="101" fill="#3fb950" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve">&gt; </text>
  <text x="43.429" y="101" fill="#e6edf3" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve">    -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 \</text>
  <text x="26" y="124" fill="#3fb950" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve">&gt; </text>
  <text x="43.429" y="124" fill="#e6edf3" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve">    deploy@203.0.113.42</text>
  <text x="26" y="147" fill="#c9d1d9" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve">deploy@203.0.113.42&#39;s password:</text>
  <text x="26" y="170" fill="#f85149" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve">Permission denied, please try again.</text>
  <text x="26" y="193" fill="#c9d1d9" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve">deploy@203.0.113.42&#39;s password:</text>
  <text x="26" y="216" fill="#f85149" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve">Permission denied (publickey).</text>
  <text x="26" y="239" fill="#c9d1d9" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14.5" xml:space="preserve"></text>
