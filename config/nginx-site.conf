# /etc/nginx/sites-available/__DOMAIN__
# Managed by scripts/configure-nginx.sh — do not edit by hand.
# Rendered from config/nginx-site.conf; placeholders are replaced at install time.

# ---------------------------------------------------------------------------
# HTTP: ACME challenge + redirect everything else to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # certbot renews via HTTP-01; keep this location reachable and unthrottled.
    location /.well-known/acme-challenge/ {
        root __SITE_ROOT__;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS: the only door that serves content.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate           /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_trusted_certificate   /etc/letsencrypt/live/__DOMAIN__/chain.pem;

    # TLS 1.2+ only; no static RSA key exchange, no session tickets.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling (resolver needed to fetch the OCSP response).
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- Security headers ---------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    server_tokens off;

    root __SITE_ROOT__;
    index index.html;

    # Basic request rate limiting; the zone is defined in
    # /etc/nginx/conf.d/00-ratelimit.conf and fail2ban watches the error log.
    limit_req_status 429;
    limit_req zone=general burst=20 nodelay;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cheap health check for uptime monitors (no access log noise).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Do not serve dotfiles (except ACME) or common backup/source artefacts.
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(?:conf|env|bak|old|log|sql|tar|gz|zip|git)$ {
        deny all;
    }

    access_log /var/log/nginx/__DOMAIN__-access.log;
    error_log  /var/log/nginx/__DOMAIN__-error.log warn;
}
