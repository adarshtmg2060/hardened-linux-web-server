# /etc/nginx/sites-available/__DOMAIN__  (BOOTSTRAP — temporary)
# Managed by scripts/configure-nginx.sh — do not edit by hand.
#
# This plain-HTTP server block exists only long enough for certbot to solve
# the HTTP-01 challenge. Once the certificate is issued it is replaced by the
# hardened TLS config from config/nginx-site.conf.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ _;

    root __SITE_ROOT__;
    index index.html;

    location /.well-known/acme-challenge/ {
        allow all;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
