# /etc/nginx/conf.d/00-ratelimit.conf
# Managed by scripts/configure-nginx.sh — do not edit by hand.
#
# Shared memory zones live in the http{} context. The site config references
# `zone=general`; fail2ban's optional nginx-limit-req jail can ban repeat
# abusers based on the resulting "limiting requests" error-log lines.

limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Optional stricter zone for future /login or /wp-admin style endpoints:
# limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
